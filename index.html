<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Merkkiajo</title>
<style>
html,body{margin:0;background:#20242a;color:white;font-family:Arial;text-align:center}
h1{font-size:25px;margin:10px 0 3px}.info{font-size:17px;margin:4px}
canvas{display:block;margin:8px auto;width:96vw;max-width:700px;height:auto;border:3px solid white;border-radius:10px;background:#6aad59}
button{font-size:25px;min-width:64px;min-height:55px;margin:4px;border:0;border-radius:12px}
#start{background:#ffd447;font-size:20px;padding:10px 25px}
</style>
</head>
<body>
<h1>🚗 MERKKIAJO</h1>
<div class="info">⭐ Pisteet: <span id="score">0</span>/3</div>
<div id="msg">Paina Aloita!</div>
<canvas id="game" width="700" height="450"></canvas>
<button id="start" onclick="startGame()">▶️ ALOITA</button>
<div>
<button ontouchstart="press('L')" ontouchend="release('L')" onmousedown="press('L')" onmouseup="release('L')">⬅️</button>
<button ontouchstart="press('U')" ontouchend="release('U')" onmousedown="press('U')" onmouseup="release('U')">⬆️</button>
<button ontouchstart="press('D')" ontouchend="release('D')" onmousedown="press('D')" onmouseup="release('D')">⬇️</button>
<button ontouchstart="press('R')" ontouchend="release('R')" onmousedown="press('R')" onmouseup="release('R')">➡️</button>
</div>
<script>
var canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
var keys={L:false,R:false,U:false,D:false}, playing=false, score=0;
var car={x:350,y:380};
var signs=[
{x:180,y:130,t:"R",done:false},{x:520,y:210,t:"L",done:false},{x:350,y:70,t:"S",done:false}
];

function press(k){keys[k]=true}
function release(k){keys[k]=false}
function startGame(){
 playing=true; score=0; car.x=350; car.y=380;
 for(var i=0;i<signs.length;i++) signs[i].done=false;
 document.getElementById("score").textContent="0";
 document.getElementById("msg").textContent="Aja ensimmäisen merkin luo!";
}
document.addEventListener("keydown",function(e){
 if(e.key==="ArrowLeft")press("L");
 if(e.key==="ArrowRight")press("R");
 if(e.key==="ArrowUp")press("U");
 if(e.key==="ArrowDown")press("D");
});
document.addEventListener("keyup",function(e){
 if(e.key==="ArrowLeft")release("L");
 if(e.key==="ArrowRight")release("R");
 if(e.key==="ArrowUp")release("U");
 if(e.key==="ArrowDown")release("D");
});

function draw(){
 ctx.clearRect(0,0,700,450);
 ctx.fillStyle="#69ad59";ctx.fillRect(0,0,700,450);
 ctx.fillStyle="#555";ctx.fillRect(120,0,460,450);
 ctx.fillStyle="#fff";
 for(var y=0;y<450;y+=65)ctx.fillRect(347,y,6,35);

 for(var i=0;i<signs.length;i++){
   var s=signs[i];
   ctx.fillStyle="#555";ctx.fillRect(s.x-3,s.y+20,6,35);
   ctx.fillStyle=s.t==="S"?"#e22":"#fff";
   ctx.beginPath();ctx.arc(s.x,s.y,24,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle="#111";ctx.lineWidth=3;ctx.stroke();
   ctx.fillStyle=s.t==="S"?"#fff":"#111";
   ctx.font="bold 25px Arial";ctx.textAlign="center";
   ctx.fillText(s.t==="R"?"→":s.t==="L"?"←":"STOP",s.x,s.y+7);
 }
 // car
 ctx.save();ctx.translate(car.x,car.y);
 ctx.fillStyle="#111";
 ctx.fillRect(-29,-24,9,18);ctx.fillRect(20,-24,9,18);
 ctx.fillRect(-29,7,9,18);ctx.fillRect(20,7,9,18);
 ctx.fillStyle="#e53935";ctx.fillRect(-24,-35,48,70);
 ctx.fillStyle="#bdefff";ctx.fillRect(-16,-25,32,19);ctx.fillRect(-16,5,32,18);
 ctx.fillStyle="#fff3a0";ctx.fillRect(-16,-33,9,4);ctx.fillRect(7,-33,9,4);
 ctx.restore();
}
function update(){
 if(playing){
   if(keys.L)car.x-=4;if(keys.R)car.x+=4;if(keys.U)car.y-=4;if(keys.D)car.y+=4;
   if(car.x<155)car.x=155;if(car.x>545)car.x=545;
   if(car.y<35)car.y=35;if(car.y>415)car.y=415;
   for(var i=0;i<signs.length;i++){
     var s=signs[i];
     if(!s.done && Math.hypot(car.x-s.x,car.y-s.y)<52){
       var ok=(s.t==="R"&&keys.R)||(s.t==="L"&&keys.L)||(s.t==="S"&&!keys.L&&!keys.R&&!keys.U&&!keys.D);
       if(ok){
         s.done=true;score++;
         document.getElementById("score").textContent=score;
         document.getElementById("msg").textContent=score===3?"🏁 Voitit!":"✅ Oikein! Seuraava merkki.";
         if(score===3)playing=false;
       }else{
         playing=false;
         document.getElementById("msg").textContent="❌ Väärin. Paina Aloita uudelleen.";
       }
     }
   }
 }
 draw();requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
